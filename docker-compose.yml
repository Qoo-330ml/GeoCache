services:
  qmby-license:
    build: .
    image: pdzhou/geocache:qmby
    container_name: qmby-license
    restart: unless-stopped
    ports:
      - "2090:2090"
    environment:
      - TZ=Asia/Shanghai
      - SERVER_ADDR=:2090
      - DB_PATH=/data/license.db
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin123
      # 可选：设置后，Qmby 调用 /api/license/verify 需要带 Authorization: Bearer <LICENSE_API_KEY>
      - LICENSE_API_KEY=
      # 必填：base64 Ed25519 私钥或 32 字节 seed，用于签名 /api/license/verify 的 license 响应
      - LICENSE_ED25519_PRIVATE_KEY=
    volumes:
      - ./data:/data
