name: Build and Push Qmby License Server Docker Image

on:
  push:
    branches:
      - main
      - codex/add-qmby-license-server
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: github.event_name != 'pull_request'

      - name: Extract tags
        id: extract_tags
        run: |
          if [[ "${{ github.ref_name }}" == "codex/add-qmby-license-server" ]]; then
            echo "TAGS=pdzhou/geocache:qmby" >> $GITHUB_OUTPUT
          else
            echo "TAGS=${{ secrets.DOCKERHUB_USERNAME }}/geocache:${{ github.ref_name }},${{ secrets.DOCKERHUB_USERNAME }}/geocache:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.extract_tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
