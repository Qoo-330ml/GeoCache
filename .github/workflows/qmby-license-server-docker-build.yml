name: Build Qmby License Server

on:
  push:
    branches:
      - main
      - codex/**
    tags:
      - license-v*.*.*
    paths:
      - qmby-license-server/**
      - .github/workflows/qmby-license-server-docker-build.yml
  pull_request:
    branches:
      - main
    paths:
      - qmby-license-server/**
      - .github/workflows/qmby-license-server-docker-build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Qmby license server image
        uses: docker/build-push-action@v6
        with:
          context: ./qmby-license-server
          platforms: linux/amd64
          push: false
          tags: qmby-license-server:ci
          cache-from: type=gha,scope=qmby-license-server
          cache-to: type=gha,mode=max,scope=qmby-license-server
