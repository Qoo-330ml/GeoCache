name: Build Qmby License Server

on:
  push:
    branches:
      - main
      - codex/**
    tags:
      - license-v*.*.*
    paths:
      - qmby-license-server/**
      - .github/workflows/qmby-license-server-docker-build.yml
  pull_request:
    branches:
      - main
    paths:
      - qmby-license-server/**
      - .github/workflows/qmby-license-server-docker-build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/license-v'))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tag
        id: extract_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${{ github.ref_name#license- }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Qmby license server image
        uses: docker/build-push-action@v6
        with:
          context: ./qmby-license-server
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/license-v')) }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/qmby-license-server:${{ steps.extract_tag.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/qmby-license-server:latest
          cache-from: type=gha,scope=qmby-license-server
          cache-to: type=gha,mode=max,scope=qmby-license-server
